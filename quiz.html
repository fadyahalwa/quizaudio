<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Media Audio Pembelajaran</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root{
    --ink:#1B2430;
    --paper:#FAF6EF;
    --panel:#FFFDF9;
    --line:#E3DBC8;
    --amber:#F2A93B;
    --amber-deep:#C97F14;
    --teal:#146B69;
    --teal-soft:#E4F1EE;
    --coral:#D4553F;
    --coral-soft:#FBEAE6;
    --muted:#7A7264;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'IBM Plex Sans',sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #F5E6C8 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, #DCEEE9 0%, transparent 40%),
      var(--paper);
    min-height:100vh;
    padding:32px 20px;
    color:var(--ink);
  }

  .container{max-width:640px;margin:0 auto;}

  /* Header */
  .header{margin-bottom:28px;}
  .eq{
    display:flex;
    align-items:flex-end;
    gap:5px;
    height:34px;
    margin-bottom:16px;
  }
  .eq span{
    width:6px;
    background:var(--amber-deep);
    border-radius:2px;
    animation:eqbeat 1.1s ease-in-out infinite;
  }
  .eq span:nth-child(1){height:40%;animation-delay:-0.9s;background:var(--teal);}
  .eq span:nth-child(2){height:80%;animation-delay:-0.4s;}
  .eq span:nth-child(3){height:55%;animation-delay:-0.7s;background:var(--coral);}
  .eq span:nth-child(4){height:100%;animation-delay:-0.1s;}
  .eq span:nth-child(5){height:65%;animation-delay:-1.1s;background:var(--teal);}
  .eq span:nth-child(6){height:35%;animation-delay:-0.3s;}
  @keyframes eqbeat{
    0%,100%{transform:scaleY(0.35);}
    50%{transform:scaleY(1);}
  }
  @media (prefers-reduced-motion: reduce){ .eq span{animation:none;} }

  .header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:2.1rem;
    letter-spacing:-0.02em;
    line-height:1.1;
  }
  .header p{
    color:var(--muted);
    font-size:1rem;
    margin-top:6px;
  }

  /* Panel */
  .content{
    background:var(--panel);
    border:1.5px solid var(--ink);
    border-radius:18px;
    padding:32px;
    box-shadow:6px 6px 0 var(--line);
  }

  /* Scrubber progress */
  .scrubber{margin-bottom:28px;}
  .scrubber-track{
    position:relative;
    width:100%;
    height:4px;
    background:var(--line);
    border-radius:4px;
  }
  .scrubber-fill{
    position:absolute;
    top:0;left:0;
    height:100%;
    width:0%;
    background:var(--amber-deep);
    border-radius:4px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }
  .scrubber-dot{
    position:absolute;
    top:50%;
    width:12px;height:12px;
    background:var(--ink);
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:left .45s cubic-bezier(.4,0,.2,1);
  }
  .scrubber-label{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:0.8rem;
    color:var(--muted);
    font-weight:500;
  }

  .quiz-section{display:none;}
  .quiz-section.active{display:block;animation:rise .35s ease;}

  .track-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--ink);
    color:var(--paper);
    padding:5px 12px;
    border-radius:20px;
    font-size:0.78rem;
    font-weight:600;
    letter-spacing:0.02em;
    margin-bottom:18px;
  }
  .track-tag::before{content:'▶';font-size:0.6rem;}

  .question-text{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.35rem;
    line-height:1.45;
    margin-bottom:24px;
  }

  /* Options as tracklist */
  .options{display:flex;flex-direction:column;gap:10px;}

  .option{
    display:flex;
    align-items:center;
    gap:14px;
    border:1.5px solid var(--line);
    background:var(--paper);
    padding:14px 16px;
    border-radius:12px;
    cursor:pointer;
    transition:border-color .18s ease, transform .18s ease, background .18s ease;
  }
  .option:hover{border-color:var(--ink);transform:translateX(3px);}
  .option input{position:absolute;opacity:0;pointer-events:none;}

  .option-idx{
    flex-shrink:0;
    width:28px;height:28px;
    border-radius:8px;
    background:var(--panel);
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:0.85rem;
    font-weight:700;
    color:var(--muted);
    transition:all .18s ease;
  }

  .option label{cursor:pointer;font-size:0.98rem;font-weight:500;flex:1;}

  .option.selected{
    border-color:var(--ink);
    background:#FFF;
  }
  .option.selected .option-idx{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  .option.locked{cursor:default;}
  .option.locked:hover{transform:none;}
  .option.mark-correct{
    border-color:var(--teal);
    background:var(--teal-soft);
  }
  .option.mark-correct .option-idx{background:var(--teal);border-color:var(--teal);color:#fff;}
  .option.mark-incorrect{
    border-color:var(--coral);
    background:var(--coral-soft);
  }
  .option.mark-incorrect .option-idx{background:var(--coral);border-color:var(--coral);color:#fff;}

  /* Feedback */
  .feedback{
    margin-top:20px;
    padding:16px 18px;
    border-radius:12px;
    display:none;
    font-size:0.92rem;
    line-height:1.55;
    border:1.5px solid;
  }
  .feedback.active{display:block;animation:rise .3s ease;}
  .feedback.correct{background:var(--teal-soft);border-color:var(--teal);color:#0E4F4D;}
  .feedback.incorrect{background:var(--coral-soft);border-color:var(--coral);color:#8C3324;}
  .feedback strong{display:block;margin-bottom:3px;font-family:'Fraunces',serif;font-size:1rem;}

  /* Buttons */
  .button-group{display:flex;gap:12px;margin-top:28px;}
  button{
    padding:13px 24px;
    border-radius:10px;
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-prev{
    background:var(--panel);
    border:1.5px solid var(--ink);
    color:var(--ink);
    flex:0 0 auto;
  }
  .btn-prev:hover{transform:translateY(-2px);}
  .btn-next{
    background:var(--ink);
    border:1.5px solid var(--ink);
    color:var(--paper);
    flex:1;
    box-shadow:3px 3px 0 var(--amber-deep);
  }
  .btn-next:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--amber-deep);}
  .btn-next:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;}

  /* Results */
  .results-section{display:none;text-align:center;animation:rise .4s ease;}
  .results-section.active{display:block;}

  .score-badge{
    width:140px;height:140px;
    margin:8px auto 22px;
    border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--panel);
    border:2px solid var(--ink);
    box-shadow:5px 5px 0 var(--amber-deep);
  }
  .score-badge .num{font-family:'Fraunces',serif;font-size:2.1rem;font-weight:700;}
  .score-badge .of{font-size:0.75rem;color:var(--muted);font-weight:600;}

  .results-text{
    font-family:'Fraunces',serif;
    font-size:1.5rem;
    font-weight:600;
    margin-bottom:10px;
  }
  .results-message{color:var(--muted);font-size:0.98rem;margin-bottom:26px;line-height:1.6;}

  .btn-restart{
    background:var(--amber-deep);
    color:#fff;
    border:1.5px solid var(--ink);
    padding:14px 30px;
    box-shadow:3px 3px 0 var(--ink);
  }
  .btn-restart:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);}

  .answer-review{margin-top:30px;text-align:left;}
  .review-title{
    font-family:'Fraunces',serif;
    font-size:1.1rem;
    font-weight:600;
    margin-bottom:14px;
  }
  .review-item{
    border:1.5px solid var(--line);
    border-left-width:4px;
    background:var(--paper);
    padding:14px 16px;
    border-radius:10px;
    margin-bottom:10px;
  }
  .review-item.correct{border-left-color:var(--teal);}
  .review-item.incorrect{border-left-color:var(--coral);}
  .review-item-q{font-weight:600;font-size:0.9rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;}
  .review-item-a{font-size:0.85rem;color:var(--muted);line-height:1.5;}
  .status-chip{
    flex-shrink:0;
    font-size:0.68rem;
    padding:3px 9px;
    border-radius:10px;
    font-weight:700;
    height:fit-content;
  }
  .status-chip.correct{background:var(--teal-soft);color:var(--teal);}
  .status-chip.incorrect{background:var(--coral-soft);color:var(--coral);}

  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

  /* ---- Success burst overlay ---- */
  .burst-overlay{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:9999;
    overflow:hidden;
  }
  .burst-ring{
    position:absolute;
    top:50%;left:50%;
    width:40px;height:40px;
    margin:-20px 0 0 -20px;
    border-radius:50%;
    border:3px solid var(--teal);
    opacity:0.9;
    animation:ringExpand 0.9s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes ringExpand{
    0%{width:40px;height:40px;margin:-20px 0 0 -20px;opacity:0.9;}
    100%{width:340px;height:340px;margin:-170px 0 0 -170px;opacity:0;}
  }
  .burst-pop{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0);
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:1.4rem;
    color:var(--teal);
    background:var(--panel);
    border:2px solid var(--teal);
    padding:10px 22px;
    border-radius:40px;
    box-shadow:3px 3px 0 var(--teal);
    animation:popIn 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes popIn{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
    55%{transform:translate(-50%,-50%) scale(1.08);opacity:1;}
    75%{transform:translate(-50%,-50%) scale(0.96);}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  }
  .burst-piece{
    position:absolute;
    top:50%;left:50%;
    font-size:1.1rem;
    animation:pieceFly 1.1s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes pieceFly{
    0%{transform:translate(-50%,-50%) scale(0.4) rotate(0deg);opacity:1;}
    100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1) rotate(var(--rot));opacity:0;}
  }

  @media (max-width:600px){
    .content{padding:22px;}
    .header h1{font-size:1.6rem;}
    .question-text{font-size:1.15rem;}
    .button-group{flex-direction:column;}
    .btn-prev{flex:1;}
  }

  /* ---- Start / name screen ---- */
  .start-section{display:none;text-align:left;animation:rise .35s ease;}
  .start-section.active{display:block;}
  .start-section p.intro{color:var(--muted);font-size:0.95rem;margin-bottom:22px;line-height:1.6;}
  .field-label{
    display:block;
    font-size:0.85rem;
    font-weight:700;
    margin-bottom:8px;
  }
  .field-input{
    width:100%;
    padding:13px 16px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-family:inherit;
    font-size:1rem;
    background:var(--paper);
    color:var(--ink);
    margin-bottom:8px;
    transition:border-color .15s ease;
  }
  .field-input:focus{outline:none;border-color:var(--ink);}
  .field-error{
    color:var(--coral);
    font-size:0.82rem;
    font-weight:600;
    min-height:18px;
    margin-bottom:14px;
  }
  .btn-start{
    background:var(--ink);
    border:1.5px solid var(--ink);
    color:var(--paper);
    width:100%;
    padding:14px;
    font-size:1rem;
    box-shadow:3px 3px 0 var(--amber-deep);
  }
  .btn-start:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--amber-deep);}

  .send-status{
    margin-top:14px;
    font-size:0.85rem;
    color:var(--muted);
    min-height:18px;
  }
  .send-status.error{color:var(--coral);font-weight:600;}
  .send-status.ok{color:var(--teal);font-weight:600;}

  /* ---- Leaderboard ---- */
  .leaderboard{
    margin-top:30px;
    text-align:left;
    border-top:1.5px solid var(--line);
    padding-top:24px;
  }
  .leaderboard-title{
    font-family:'Fraunces',serif;
    font-size:1.1rem;
    font-weight:600;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .leaderboard-empty{
    color:var(--muted);
    font-size:0.88rem;
  }
  .leaderboard-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .leaderboard-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--paper);
  }
  .leaderboard-item.rank-1{border-color:var(--amber-deep);background:#FCF1DC;}
  .leaderboard-item.rank-2{border-color:#9CA3AF;}
  .leaderboard-item.rank-3{border-color:#B8804A;}
  .leaderboard-medal{font-size:1.2rem;flex-shrink:0;width:24px;text-align:center;}
  .leaderboard-name{font-weight:600;flex:1;font-size:0.92rem;}
  .leaderboard-score{font-weight:700;font-size:0.92rem;color:var(--teal);}
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="eq" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <h1>Quiz Media Audio</h1>
      <p>Uji pemahamanmu soal media audio dalam pembelajaran</p>
    </div>

    <div class="content">
      <div class="scrubber">
        <div class="scrubber-track">
          <div class="scrubber-fill" id="progressFill"></div>
          <div class="scrubber-dot" id="progressDot" style="left:0%"></div>
        </div>
        <div class="scrubber-label">
          <span id="scrubberNow">Soal 1</span>
          <span id="scrubberTotal">dari 10</span>
        </div>
      </div>

      <div class="start-section active" id="startSection">
        <p class="intro">Isi namamu dulu ya sebelum mulai. Nama & nilai kamu akan tercatat otomatis.</p>
        <label class="field-label" for="participantName">Nama lengkap</label>
        <input type="text" id="participantName" class="field-input" placeholder="Contoh: Fadya Halwa" autocomplete="off">
        <div class="field-error" id="nameError"></div>
        <button class="btn-start" onclick="startQuiz()">Mulai Quiz</button>
      </div>

      <div id="quizContainer"></div>

      <div class="results-section" id="resultsSection">
        <div class="score-badge">
          <div class="num" id="scoreNum"></div>
          <div class="of">TEPAT</div>
        </div>
        <div class="results-text" id="resultsText"></div>
        <div class="results-message" id="resultsMessage"></div>
        <div class="answer-review" id="answerReview"></div>
        <div class="send-status" id="sendStatus"></div>

        <div class="leaderboard">
          <div class="leaderboard-title">🏆 Skor Tertinggi</div>
          <div id="leaderboardContent"><div class="leaderboard-empty">Memuat papan skor...</div></div>
        </div>

        <button class="btn-restart" onclick="restartQuiz()">Mulai Ulang Quiz</button>
      </div>
    </div>
  </div>

<script>
  const allQuestions = [
    {
      question: "Seorang dosen ingin menjelaskan cara pengucapan bahasa asing. Media mana yang paling tepat?",
      options: [
        { text: "Infografis", correct: false },
        { text: "Audio", correct: true },
        { text: "Poster", correct: false },
        { text: "Diagram", correct: false }
      ],
      explanation: "Audio adalah media yang paling efektif untuk menjelaskan pengucapan bahasa asing karena peserta didik dapat mendengarkan langsung bagaimana cara melafalkan kata-kata dengan benar."
    },
    {
      question: "Audio pembelajaran berdurasi 30 menit vs 5 menit. Mana yang lebih efektif?",
      options: [
        { text: "30 menit", correct: false },
        { text: "5 menit", correct: false },
        { text: "Tergantung tujuan dan materi", correct: true },
        { text: "Keduanya sama", correct: false }
      ],
      explanation: "Efektivitas durasi audio tergantung pada tujuan pembelajaran dan kompleksitas materi. Materi sederhana mungkin cukup dengan 5 menit, sementara materi kompleks memerlukan durasi lebih panjang."
    },
    {
      question: "Apa yang perlu diperhatikan saat merancang media audio?",
      options: [
        { text: "Durasi harus selalu panjang", correct: false },
        { text: "Suara harus jelas dan materi sesuai tujuan", correct: true },
        { text: "Tidak perlu melakukan uji coba", correct: false },
        { text: "Tampilan harus indah", correct: false }
      ],
      explanation: "Kualitas suara yang jelas dan kesesuaian materi dengan tujuan pembelajaran adalah aspek fundamental dalam merancang media audio yang efektif."
    },
    {
      question: "Jika kualitas suara buruk, apakah materi audio tetap efektif?",
      options: [
        { text: "Ya", correct: false },
        { text: "Tidak", correct: false },
        { text: "Tergantung", correct: true },
        { text: "Tidak ada pengaruh", correct: false }
      ],
      explanation: "Kualitas suara yang buruk dapat menghambat pembelajaran, namun jika materi sangat penting dan tidak ada alternatif, siswa masih bisa belajar dengan usaha lebih. Namun tetap sebaiknya kualitas suara dijaga dengan baik."
    },
    {
      question: "Mana yang lebih penting dalam media audio?",
      options: [
        { text: "Suara yang bagus", correct: false },
        { text: "Materi yang menarik", correct: false },
        { text: "Kesesuaian dengan tujuan pembelajaran", correct: true },
        { text: "Durasi yang panjang", correct: false }
      ],
      explanation: "Kesesuaian dengan tujuan pembelajaran adalah prioritas utama karena tanpa ini, media audio tidak akan mencapai hasil pembelajaran yang diharapkan, terlepas dari kualitas atau menariknya materi."
    },
    {
      question: "Manakah kondisi yang PALING kurang sesuai jika hanya menggunakan media audio?",
      options: [
        { text: "Melatih kemampuan listening bahasa asing", correct: false },
        { text: "Mendengarkan pembacaan puisi", correct: false },
        { text: "Mempelajari bentuk dan posisi suatu objek secara visual-spasial", correct: true },
        { text: "Mendengarkan materi melalui radio pendidikan", correct: false }
      ],
      explanation: "Karena media audio tidak memiliki unsur visual, materi yang bersifat visual-spasial sulit disampaikan."
    },
    {
      question: "Manakah siswa yang paling mungkin mengalami kesulitan memahami media audio?",
      options: [
        { text: "Siswa yang memperhatikan dan mencatat poin penting", correct: false },
        { text: "Siswa yang mendengarkan dengan fokus", correct: false },
        { text: "Siswa yang memiliki kemampuan menyimak rendah", correct: true },
        { text: "Siswa yang sibuk scroll HP saat audio diputar", correct: false, feedback: "Kalau jawab ini, sebenarnya kamu juga nggak salah sih... tapi itu masalahnya beda lagi. Yang ditanya di sini soal kemampuan menyimak, bukan soal fokus/distraksi." }
      ],
      explanation: "Siswa dengan kemampuan menyimak rendah akan lebih sulit menangkap dan mengolah informasi yang hanya disampaikan lewat suara, karena audio menuntut pemahaman pendengaran secara langsung tanpa bantuan visual."
    },
    {
      question: "Kalau media audio hanya menyampaikan informasi melalui pendengaran, lalu kamu masih mencari gambarnya di layar, berarti kamu...",
      options: [
        { text: "Sedang memahami materi", correct: false },
        { text: "Sedang berimajinasi", correct: false },
        { text: "Kurang menyimak materi", correct: true },
        { text: "Sedang menguji media", correct: false }
      ],
      wrongFeedback: "Waduh, gambarnya nggak ada, bang. Dari tadi yang dipakai telinga, bukan mata.",
      explanation: "Audio pembelajaran mengandalkan indra pendengaran, jadi kalau kamu masih mencari-cari visual di layar, tandanya kamu belum sepenuhnya fokus menyimak lewat telinga."
    },
    {
      question: "Dalam media audio pembelajaran, musik dan sound effect sebaiknya digunakan untuk...",
      options: [
        { text: "Membuat audio semenarik mungkin meskipun mengganggu isi pesan", correct: false },
        { text: "Menggantikan sebagian besar penjelasan narator", correct: false },
        { text: "Menguatkan suasana tanpa mengalihkan perhatian dari isi pesan", correct: true },
        { text: "Membuat durasi audio menjadi lebih panjang", correct: false }
      ],
      explanation: "Kata kuncinya \u201cpenguat suasana, bukan mengalihkan perhatian\u201d \u2014 musik dan efek suara harus mendukung isi pesan, bukan menggeser fokus pendengar dari materi utamanya."
    },
    {
      question: "Jika audio berdurasi 30 menit digunakan untuk materi yang sebenarnya bisa dijelaskan dalam 5 menit, masalah yang paling mungkin terjadi adalah...",
      options: [
        { text: "Siswa semakin pintar", correct: false },
        { text: "Siswa semakin fokus", correct: false },
        { text: "Siswa berpotensi bosan dan kehilangan konsentrasi", correct: true },
        { text: "Audio menjadi lebih efektif", correct: false }
      ],
      wrongFeedback: "30 menit dengerin audio? Yang ada bukan materinya yang masuk, tapi ngantuknya.",
      explanation: "Durasi yang tidak sebanding dengan kompleksitas materi membuat audio bertele-tele, sehingga siswa gampang bosan dan kehilangan konsentrasi sebelum materi selesai."
    }
  ];

  function shuffleArray(arr){
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickFeedback(question, optIndex){
    const opt = question.options[optIndex];
    if (opt.feedback) return opt.feedback;
    if (!opt.correct && question.wrongFeedback) return question.wrongFeedback;
    return question.explanation;
  }

  let quizData = [];
  const idxLabels = ['A','B','C','D','E','F'];
  let currentQuestion = 0;
  let answers = [];
  let participantName = '';

  // GANTI URL DI BAWAH INI dengan URL Web App dari Google Apps Script kamu
  // (lihat panduan setup Google Sheet yang diberikan terpisah)
  const GOOGLE_SCRIPT_URL = 'PASTE_URL_APPS_SCRIPT_DI_SINI';

  function startQuiz(){
    const input = document.getElementById('participantName');
    const errorEl = document.getElementById('nameError');
    const name = input.value.trim();

    if (name.length < 2){
      errorEl.textContent = 'Masukkan nama yang valid ya (minimal 2 huruf).';
      input.focus();
      return;
    }

    errorEl.textContent = '';
    participantName = name;
    quizData = shuffleArray(allQuestions);
    currentQuestion = 0;
    answers = [];
    document.getElementById('startSection').classList.remove('active');
    initQuiz();
  }

  function initQuiz(){ renderQuestion(); }

  function renderQuestion(){
    const quizContainer = document.getElementById('quizContainer');
    quizContainer.innerHTML = '';

    const question = quizData[currentQuestion];
    const locked = answers[currentQuestion] !== undefined;

    const section = document.createElement('div');
    section.className = 'quiz-section active';

    const tag = document.createElement('span');
    tag.className = 'track-tag';
    tag.textContent = `Track ${currentQuestion + 1} / ${quizData.length}`;

    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.textContent = question.question;

    const options = document.createElement('div');
    options.className = 'options';

    question.options.forEach((option, index) => {
      const optionDiv = document.createElement('div');
      optionDiv.className = 'option';
      if(locked) optionDiv.classList.add('locked');

      const idxChip = document.createElement('span');
      idxChip.className = 'option-idx';
      idxChip.textContent = idxLabels[index];

      const label = document.createElement('label');
      label.textContent = option.text;

      optionDiv.appendChild(idxChip);
      optionDiv.appendChild(label);

      if(locked){
        if(option.correct) optionDiv.classList.add('mark-correct');
        if(index === answers[currentQuestion] && !option.correct) optionDiv.classList.add('mark-incorrect');
      } else {
        optionDiv.addEventListener('click', () => selectOption(optionDiv, index));
      }

      if (answers[currentQuestion] === index) optionDiv.classList.add('selected');

      options.appendChild(optionDiv);
    });

    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    feedback.id = `feedback-${currentQuestion}`;

    if (locked){
      const isCorrect = quizData[currentQuestion].options[answers[currentQuestion]].correct;
      feedback.classList.add('active', isCorrect ? 'correct' : 'incorrect');
      feedback.innerHTML = `<strong>${isCorrect ? 'Tepat sekali!' : 'Belum pas.'}</strong>${pickFeedback(question, answers[currentQuestion])}`;
    }

    section.appendChild(tag);
    section.appendChild(qText);
    section.appendChild(options);
    section.appendChild(feedback);
    quizContainer.appendChild(section);

    updateProgressBar();
    updateButtons();
  }

  function selectOption(element, index){
    answers[currentQuestion] = index;
    const isCorrect = quizData[currentQuestion].options[index].correct;

    // lock & mark all options immediately
    const allOptions = element.parentElement.querySelectorAll('.option');
    allOptions.forEach((el, i) => {
      el.classList.add('locked');
      el.replaceWith(el.cloneNode(true)); // strip click listeners
    });
    const refreshed = document.querySelectorAll('.option');
    refreshed.forEach((el, i) => {
      const opt = quizData[currentQuestion].options[i];
      if (opt.correct) el.classList.add('mark-correct');
      if (i === index && !opt.correct) el.classList.add('mark-incorrect');
      if (i === index) el.classList.add('selected');
    });

    const feedback = document.getElementById(`feedback-${currentQuestion}`);
    feedback.classList.add('active', isCorrect ? 'correct' : 'incorrect');
    feedback.innerHTML = `<strong>${isCorrect ? 'Tepat sekali!' : 'Belum pas.'}</strong>${pickFeedback(quizData[currentQuestion], index)}`;

    updateButtons();

    if (isCorrect) createSuccessBurst();
  }

  function createSuccessBurst(){
    const overlay = document.createElement('div');
    overlay.className = 'burst-overlay';

    const ring = document.createElement('div');
    ring.className = 'burst-ring';
    overlay.appendChild(ring);

    const ring2 = document.createElement('div');
    ring2.className = 'burst-ring';
    ring2.style.animationDelay = '0.12s';
    overlay.appendChild(ring2);

    const pop = document.createElement('div');
    pop.className = 'burst-pop';
    pop.textContent = 'Benar! ✓';
    overlay.appendChild(pop);

    const glyphs = ['♪','♫','♬','●'];
    const colors = ['#146B69','#F2A93B','#D4553F','#1B2430'];
    for(let i = 0; i < 10; i++){
      const piece = document.createElement('div');
      piece.className = 'burst-piece';
      piece.textContent = glyphs[i % glyphs.length];
      piece.style.color = colors[i % colors.length];
      const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.3;
      const dist = 90 + Math.random() * 70;
      piece.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
      piece.style.setProperty('--ty', `${Math.sin(angle) * dist - 30}px`);
      piece.style.setProperty('--rot', `${(Math.random() - 0.5) * 360}deg`);
      piece.style.animationDelay = `${0.05 + Math.random() * 0.1}s`;
      overlay.appendChild(piece);
    }

    document.body.appendChild(overlay);
    setTimeout(() => overlay.remove(), 1300);
  }

  function updateProgressBar(){
    const progress = ((currentQuestion + 1) / quizData.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressDot').style.left = progress + '%';
    document.getElementById('scrubberNow').textContent = `Soal ${currentQuestion + 1}`;
    document.getElementById('scrubberTotal').textContent = `dari ${quizData.length}`;
  }

  function updateButtons(){
    let btnPrev = document.querySelector('.btn-prev');
    let btnNext = document.querySelector('.btn-next');
    if(!btnPrev){ createButtons(); btnPrev = document.querySelector('.btn-prev'); btnNext = document.querySelector('.btn-next'); }
    btnPrev.style.visibility = currentQuestion === 0 ? 'hidden' : 'visible';
    btnNext.disabled = answers[currentQuestion] === undefined;
    btnNext.textContent = currentQuestion === quizData.length - 1 ? 'Lihat Hasil' : 'Lanjut';
  }

  function createButtons(){
    const quizContainer = document.getElementById('quizContainer');
    const buttonGroup = document.createElement('div');
    buttonGroup.className = 'button-group';

    const btnPrev = document.createElement('button');
    btnPrev.className = 'btn-prev';
    btnPrev.textContent = 'Kembali';
    btnPrev.onclick = previousQuestion;

    const btnNext = document.createElement('button');
    btnNext.className = 'btn-next';
    btnNext.textContent = 'Lanjut';
    btnNext.disabled = true;
    btnNext.onclick = nextQuestion;

    buttonGroup.appendChild(btnPrev);
    buttonGroup.appendChild(btnNext);
    quizContainer.appendChild(buttonGroup);
  }

  function nextQuestion(){
    if (answers[currentQuestion] === undefined) return;
    if (currentQuestion === quizData.length - 1){
      showResults();
    } else {
      currentQuestion++;
      renderQuestion();
    }
  }

  function previousQuestion(){
    if (currentQuestion > 0){ currentQuestion--; renderQuestion(); }
  }

  function showResults(){
    document.getElementById('quizContainer').style.display = 'none';

    const score = answers.reduce((acc, answer, index) =>
      acc + (quizData[index].options[answer].correct ? 1 : 0), 0);
    const percentage = (score / quizData.length) * 100;

    document.getElementById('scoreNum').textContent = `${score}/${quizData.length}`;
    document.getElementById('resultsText').textContent = `Skor kamu: ${percentage.toFixed(0)}%`;

    let message = '';
    if (percentage === 100) message = 'Sempurna! Kamu menguasai materi media audio pembelajaran dengan sangat baik.';
    else if (percentage >= 80) message = 'Bagus! Pemahamanmu tentang media audio pembelajaran sudah sangat baik.';
    else if (percentage >= 60) message = 'Cukup baik! Terus tingkatkan pemahaman tentang media audio pembelajaran.';
    else message = 'Perlu belajar lebih lanjut. Yuk pelajari kembali konsep media audio pembelajaran.';

    document.getElementById('resultsMessage').textContent = message;
    renderAnswerReview();
    document.getElementById('resultsSection').classList.add('active');

    sendResultsToSheet(score, quizData.length, percentage);
    fetchLeaderboard();
  }

  function fetchLeaderboard(){
    const el = document.getElementById('leaderboardContent');

    if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === 'PASTE_URL_APPS_SCRIPT_DI_SINI'){
      el.innerHTML = '<div class="leaderboard-empty">Papan skor belum aktif (URL Google Script belum diisi).</div>';
      return;
    }

    el.innerHTML = '<div class="leaderboard-empty">Memuat papan skor...</div>';

    fetch(GOOGLE_SCRIPT_URL)
      .then(res => res.json())
      .then(top3 => {
        if (!Array.isArray(top3) || top3.length === 0){
          el.innerHTML = '<div class="leaderboard-empty">Belum ada data peserta.</div>';
          return;
        }
        const medals = ['🥇','🥈','🥉'];
        const list = document.createElement('ul');
        list.className = 'leaderboard-list';
        top3.forEach((entry, i) => {
          const li = document.createElement('li');
          li.className = `leaderboard-item rank-${i + 1}`;
          li.innerHTML = `
            <span class="leaderboard-medal">${medals[i] || (i + 1)}</span>
            <span class="leaderboard-name">${entry.nama}</span>
            <span class="leaderboard-score">${entry.skor}/${entry.total}</span>
          `;
          list.appendChild(li);
        });
        el.innerHTML = '';
        el.appendChild(list);
      })
      .catch(() => {
        el.innerHTML = '<div class="leaderboard-empty">Gagal memuat papan skor.</div>';
      });
  }

  function sendResultsToSheet(score, total, percentage){
    const statusEl = document.getElementById('sendStatus');

    if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === 'PASTE_URL_APPS_SCRIPT_DI_SINI'){
      statusEl.textContent = '';
      return;
    }

    statusEl.textContent = 'Menyimpan hasil...';
    statusEl.className = 'send-status';

    const payload = {
      nama: participantName,
      skor: score,
      total: total,
      persentase: percentage.toFixed(0),
      waktu: new Date().toLocaleString('id-ID')
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusEl.textContent = 'Hasil kamu sudah tersimpan ✓';
      statusEl.className = 'send-status ok';
    })
    .catch(() => {
      statusEl.textContent = 'Gagal menyimpan hasil (cek koneksi internet).';
      statusEl.className = 'send-status error';
    });
  }

  function renderAnswerReview(){
    const reviewDiv = document.getElementById('answerReview');
    reviewDiv.innerHTML = '<div class="review-title">Ringkasan Jawaban</div>';

    answers.forEach((answer, index) => {
      const isCorrect = quizData[index].options[answer].correct;
      const item = document.createElement('div');
      item.className = `review-item ${isCorrect ? 'correct' : 'incorrect'}`;
      item.innerHTML = `
        <div class="review-item-q">
          <span>Soal ${index + 1}: ${quizData[index].question}</span>
          <span class="status-chip ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? 'Benar' : 'Salah'}</span>
        </div>
        <div class="review-item-a">
          Jawabanmu: ${quizData[index].options[answer].text}
          ${!isCorrect ? `<br>Jawaban benar: ${quizData[index].options.find(o => o.correct).text}` : ''}
        </div>
      `;
      reviewDiv.appendChild(item);
    });
  }

  function restartQuiz(){
    currentQuestion = 0;
    answers = [];
    participantName = '';
    document.getElementById('participantName').value = '';
    document.getElementById('sendStatus').textContent = '';
    document.getElementById('leaderboardContent').innerHTML = '<div class="leaderboard-empty">Memuat papan skor...</div>';
    document.getElementById('quizContainer').style.display = 'block';
    document.getElementById('quizContainer').innerHTML = '';
    document.getElementById('resultsSection').classList.remove('active');
    document.getElementById('startSection').classList.add('active');
  }

  document.getElementById('scrubberTotal').textContent = `dari ${allQuestions.length}`;

  document.getElementById('participantName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startQuiz();
  });
</script>
